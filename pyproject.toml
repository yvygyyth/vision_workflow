[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-workflow"
version = "0.1.0"
description = "模块组成流程、流程组成工作流：模板识别 + 鼠标操作 + Python 配置"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Vision Workflow" }]
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pillow>=10.0",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "typer>=0.12",
    "numpy>=1.26",
    "opencv-python-headless>=4.8",
    "pyautogui>=0.9.54",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "poethepoet>=0.32",
]

[project.scripts]
vision-workflow = "vision_workflow.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py310"

# 类似 npm scripts：poe <任务名>
[tool.poe.tasks]
flow = "vision-workflow flow config.flow"
dry = "vision-workflow flow config.flow --dry-run"
info = "vision-workflow info"
version = "vision-workflow version"
test = "pytest"
lint = "ruff check src tests config"
