[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-bot"
version = "0.2.0"
description = "千里单骑自动化（Flow + 识图）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Vision Workflow" }]
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pillow>=10.0",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "typer>=0.12",
    "numpy>=1.26",
    "opencv-python-headless>=4.8",
    "pyautogui>=0.9.54",
    "customtkinter>=5.2",
    "pynput>=1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "poethepoet>=0.32",
    "pyinstaller>=6.0",
]
ocr = [
    "rapidocr>=3.0",
    "onnxruntime>=1.17",
]

[project.scripts]
vision-bot = "vision_bot.cli:app"
vision-bot-ui = "vision_bot.ui.app:run_app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

# 类似 npm scripts：poe <任务名>
[tool.poe.tasks]
run = "vision-bot run"
ui = "vision-bot ui"
version = "vision-bot version"
test = "pytest tests/test_vision_bot.py"
lint = "ruff check src/vision_bot tests/test_vision_bot.py"
build = "python scripts/build_exe.py"

